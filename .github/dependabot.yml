version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      all-deps:
        patterns:
          - '*'
    ignore:
      # `deploy` drives the TypeScript compiler API, which TypeScript 7 (the native Go port) does not ship yet.
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
